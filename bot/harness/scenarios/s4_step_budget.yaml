id: S4
title: Исчерпан бюджет шагов графа
requirement: сценарий упирается в бюджет шагов — поведение на исчерпании
contract: [C09]
# Бюджет шагов урезан до 4 узлов (обычно 10; самый длинный путь — 7). Доменный вопрос
# не успевает дойти до генерации: оркестратор останавливает ход, переводит его в fallback
# (честное сообщение, LLM не вызывается), граф не «крутится дальше». Короткий путь отказа
# укладывается в бюджет и работает как обычно.
limits: {max_steps: 4}
turns:
  - user: "Как учесть замену материала после расчета заказа?"
    expect:
      kind: fallback
      reason: budget_exhausted
      llm_called: false
      must_not_contain: ["закладке"]
  - user: "Подскажи рецепт борща"
    expect: {kind: refuse, reason: out_of_domain}
  - user: "Как учесть замену материала после расчета заказа?"
    expect: {kind: fallback, reason: budget_exhausted, clarifications: 0}
