id: S1
title: Уточнение редакции, затем ответ
requirement: второй шаг зависит от результата первого
contract: [C04, C02, C03]
# Ход 1: редакция не названа — бот уточняет (вопрос по существу, не о домене).
# Ход 2: короткий ответ «модуль для ERP» сам по себе не вопрос; поиск идёт по цепочке
# «исходный вопрос + ответ», и ответ строится по статье именно для ERP.
turns:
  - user: "Как обновить Полиграфию до нового релиза?"
    llm: '{"type": "clarify", "text": "Уточните, пожалуйста, редакцию: «1С:УНФ 8. Полиграфия 2» или модуль Полиграфия для 1С:ERP?", "cited_chunk_ids": []}'
    expect:
      kind: clarify
      pending: question
      clarifications: 1
  - user: "У нас модуль Полиграфия для 1С:ERP"
    llm: '{"type": "answer", "text": "Обновление идёт в два этапа: сначала конфигурация 1С:ERP, затем модуль Полиграфии.", "cited_chunk_ids": ["faq:poly2-181#5"]}'
    expect:
      kind: answer
      sources_any: ["faq:poly2-181"]
      prompt_must_contain: ["Как обновить Полиграфию до нового релиза"]   # исходный вопрос дошёл до LLM
      pending: null
      clarifications: 1           # счётчик держится до конца проблемы
