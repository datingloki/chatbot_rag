id: S5
title: Пользователь меняет вводные после ответа
requirement: противоречие или изменение вводных по ходу
contract: [C02, C03, C04]
# Ход 1: ответ по модулю для 1С:ERP. Ход 2: «ошиблась, у нас Полиграфия 8» — старый ответ
# по ERP повторять нельзя: бот уточняет редакцию или отвечает по другой, но не ссылается
# на статью для ERP. Новые вводные доходят до LLM.
turns:
  - user: "Как обновить модуль Полиграфия для 1С:ERP?"
    llm: '{"type": "answer", "text": "Сначала обновите конфигурацию 1С:ERP, затем модуль Полиграфии.", "cited_chunk_ids": ["faq:poly2-181#5"]}'
    expect: {kind: answer, sources_any: ["faq:poly2-181"]}
  - user: "Ой, ошиблась: у нас не ERP, а 1С:Полиграфия 8. Как обновить её?"
    llm: '{"type": "clarify", "text": "Уточните, пожалуйста: «1С:Предприятие 8. Полиграфия» редакции 1.3 или «1С:УНФ 8. Полиграфия 2»?", "cited_chunk_ids": []}'
    expect:
      kind_in: [clarify, answer, handoff]
      sources_none: ["faq:poly2-181"]
      prompt_must_contain: ["Полиграфия 8"]
      must_not_contain: ["заявка создана"]
